# Re-enabled when the repository went public: Actions is metered on private
# repositories and the account's budget blocked every job before it started,
# which is why this file spent its life as `ci.yml.disabled`. Public
# repositories get unmetered runners, so the constraint is gone — including for
# the Windows job below, which used to bill at twice the Linux rate.
#
# The `pre-push` hook stays as the local gate and is still worth enabling on
# every clone (`git config core.hooksPath .githooks`): it fails in seconds on
# the machine that broke the build, rather than after a push and a runner spin-up.
#
# NOTE if you add a Linux build job: it must install keybinder-3.0 before
# `flutter build linux`, or it fails at "Unable to generate build files"
# because hotkey_manager links against it. `libsecret-1-dev` likewise, for
# flutter_secure_storage:
#   - run: sudo apt-get update && sudo apt-get install -y keybinder-3.0 libsecret-1-dev
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The `pre-commit` hook is opt-in per clone (`git config core.hooksPath
  # .githooks`) and git never runs it for a merge, rebase or cherry-pick commit,
  # so on its own it is a courtesy, not a gate. This job is the server-side
  # fallback, for a public repository where a pushed blob stays reachable
  # through `refs/pull/*` even after a history rewrite. The hook stays the first
  # stop: it fails before the commit exists, this fails after the push.
  #
  # `fetch-depth: 0` because gitleaks-action walks the commit range of the pull
  # request or push, which a shallow clone cannot supply.
  guard:
    name: Blocked paths + secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every tracked path in the final tree, not a diff: it is cheap, and it
      # needs no base-ref arithmetic, which goes wrong on a push to `main`. It
      # sees only what the tree holds now, so it does not cover history — the
      # next step does. The rule is `tool/blocked-paths.sh`, the very script the
      # hook runs.
      - name: Blocked paths
        shell: bash
        run: git ls-files -z | tr '\0' '\n' | bash tool/blocked-paths.sh

      # Every path touched by any commit in the range. A pull request that adds
      # `inbox.md` in one commit and deletes it in the next leaves a clean final
      # tree, yet the blob stays reachable through `refs/pull/*`; only walking
      # the commits sees it. This is also what covers the merge, rebase and
      # cherry-pick commits the hook never runs for. The all-zero `before` SHA is
      # the first push of a branch: there is no earlier tip to diff from, so there
      # is no range to scan and the step ends cleanly.
      # `shell: bash` is load-bearing: GitHub then runs `bash -eo pipefail`.
      # Without a `shell:` key it runs `bash -e`, no `pipefail`, and a failing
      # `git log` (a force-push leaves `before` out of the clone: "bad revision")
      # would feed the script empty input, which it answers with exit 0.
      - name: Blocked paths in the commit range
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="origin/$BASE..HEAD"
          elif [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="$BEFORE..HEAD"
          else
            echo "no range to scan"; exit 0
          fi
          git -c core.quotePath=false log -z --name-only --pretty=format: --diff-filter=ACMRT "$range" | tr '\0' '\n' | bash tool/blocked-paths.sh

      # Scans only the commits of the pull request, or the pushed range on a
      # push. No GITLEAKS_LICENSE: the action's README requires one for
      # organization accounts only, and this repository belongs to a personal
      # account. Pinned by SHA like every third-party action in this file (see
      # the subosito pin below).
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fast gate: the whole test suite is pure Dart (bar a handful of testWidgets
  # files), so it needs no platform toolchain and runs on Linux.
  analyze-and-test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      # analysis_options.yaml: flutter_lints + avoid_print + prefer_final_locals.
      # Left at the default severity on purpose — the job's job right now is to
      # catch compile errors, not to fail on a pre-existing lint info.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android
        run: flutter build apk --debug

  build-apple:
    name: Build macOS + iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build macOS
        run: flutter build macos --debug

      # Device rather than simulator, so the gate covers the artefact that
      # actually ships. It was forced at first — mobile_scanner 6.x pulled in
      # GoogleMLKit, which has no arm64 slice for the simulator, and this runner
      # is Apple Silicon — but 7.x dropped MLKit for native APIs and the
      # simulator builds cleanly again. Kept on device because that is the
      # better gate, not because the simulator is broken.
      - name: Build iOS (device)
        run: flutter build ios --debug --no-codesign

      # The on-device speech engine, built and then actually *run* on this
      # runner. macOS is the one remaining platform where CI can do both:
      # a macOS runner executes macOS binaries, so this is real runtime
      # evidence rather than a compile that nobody exercised — which is the
      # failure mode the whole on-device slice was warned against.
      #
      # Metal is off here and only here. It is a large win on Apple Silicon and
      # belongs in the shipped build, but a headless runner compiling shaders
      # at first use is a variable this gate does not want; the CPU path is
      # what makes the result deterministic.
      - name: Build the whisper shim
        run: |
          cmake -S native -B build/native \
            -DCMAKE_BUILD_TYPE=Release -DGGML_METAL=OFF
          cmake --build build/native --target augustyniak_whisper -j 3

      # The desktop decoder shells out to ffmpeg, exactly as it does on Linux.
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Fetch a speech model
        run: |
          curl -sSfL --retry 3 -o build/model.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin
          echo "818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7  build/model.bin" \
            | shasum -a 256 -c -

      # The sample ships inside the whisper.cpp checkout the build just fetched,
      # so nothing extra is downloaded and the audio is real speech rather than
      # a tone the assertion could not say anything about.
      # The native test skips itself when its artifacts are absent, which is
      # right for a developer machine with no native build and wrong for a
      # gate: a renamed path would skip silently and report green forever.
      # Asserting the three inputs exist is what makes this step fail loudly
      # instead — the same rule the processing wait had to learn in #77.
      - name: Check the engine artifacts are really there
        run: |
          test -s build/native/libaugustyniak_whisper.dylib
          test -s build/model.bin
          test -s build/native/_deps/whisper_cpp-src/samples/jfk.wav

      - name: Transcribe a real capture on macOS
        env:
          AUG_WHISPER_LIB: build/native/libaugustyniak_whisper.dylib
          AUG_WHISPER_MODEL: build/model.bin
          AUG_WHISPER_AUDIO: build/native/_deps/whisper_cpp-src/samples/jfk.wav
        run: flutter test test/whisper_engine_native_test.dart

  # Windows-specific native gate for global hotkeys, OCR and media plugins.
  # Analyze alone would never catch a broken native registration.
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build
        run: flutter build windows --debug

      # The `windows/CMakeLists.txt` build already produced and installed the
      # shim next to the executable, so this checks the artefact that actually
      # ships rather than a copy built a second way. A bundle missing it is the
      # failure the option defaults to ON to avoid.
      - name: Check the engine shipped in the bundle
        shell: bash
        run: |
          find build/windows -name augustyniak_whisper.dll -print
          test -s "$(find build/windows -name augustyniak_whisper.dll | head -1)"

      # The desktop decoder shells out to ffmpeg, as it does on Linux and macOS.
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Fetch a speech model
        shell: bash
        run: |
          mkdir -p build/engine
          curl -sSfL --retry 3 -o build/engine/model.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin
          echo "818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7  build/engine/model.bin" \
            | sha256sum -c -

      # Same loudness rule as the macOS job: the native test skips itself when
      # its artifacts are absent, so a renamed path would report green forever.
      - name: Check the engine artifacts are really there
        shell: bash
        run: |
          find build/windows -path '*whisper_cpp-src/samples/jfk.wav' -print
          test -s "$(find build/windows -path '*whisper_cpp-src/samples/jfk.wav' | head -1)"

      - name: Transcribe a real capture on Windows
        shell: bash
        run: |
          export AUG_WHISPER_LIB="$(find build/windows -name augustyniak_whisper.dll | head -1)"
          export AUG_WHISPER_MODEL="build/engine/model.bin"
          export AUG_WHISPER_AUDIO="$(find build/windows -path '*whisper_cpp-src/samples/jfk.wav' | head -1)"
          flutter test test/whisper_engine_native_test.dart
