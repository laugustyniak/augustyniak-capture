name: voice_notes_phase1
description: Offline-first Flutter voice recorder. Audio is persisted before transcription starts.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  record: ^7.1.1
  path_provider: ^2.1.6
  path: ^1.9.1
  http: ^1.6.0
  uuid: ^4.5.1
  audioplayers: ^6.1.0
  file_picker: ^8.1.6
  # Desktop-only global shortcuts. Both degrade to no-ops on mobile because the
  # shell never builds their implementations there.
  hotkey_manager: ^0.2.3
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
