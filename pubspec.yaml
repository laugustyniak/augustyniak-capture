name: audivoa_core
description: Offline-first Flutter voice recorder. Audio is persisted before transcription starts.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  record: ^7.1.1
  path_provider: ^2.1.6
  path: ^1.9.1
  http: ^1.6.0
  uuid: ^4.5.1
  audioplayers: ^6.1.0
  file_picker: ^8.1.6
  # Desktop-only global shortcuts. Both degrade to no-ops on mobile because the
  # shell never builds their implementations there.
  hotkey_manager: ^0.2.3
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Vendored rather than fetched at runtime: the app is offline-first, so a
  # font that only renders once the device has network would be a regression.
  # Both families are SIL OFL 1.1 (licences alongside the files).
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
