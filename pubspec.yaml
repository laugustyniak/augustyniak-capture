name: augustyniak_capture
description: Offline-first Flutter voice recorder. Audio is persisted before transcription starts.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  record: ^7.1.1
  path_provider: ^2.1.6
  path: ^1.9.1
  http: ^1.6.0
  uuid: ^4.5.1
  audioplayers: ^6.1.0
  file_picker: ^11.0.0
  # Desktop-only global shortcuts. Both degrade to no-ops on mobile because the
  # shell never builds their implementations there.
  hotkey_manager: ^0.2.3
  window_manager: ^0.5.2
  # Token encryption at rest: master key in the OS keyring, AES-GCM in Dart.
  # flutter_secure_storage needs libsecret-1-dev at build time on Linux.
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  # Cross-platform SQLite engine with FTS5 support and Turso/libSQL compatibility
  sqlite3: ^3.5.1
  # QR Code generation on desktop and scanning on mobile
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  # Zip reader/writer for the portable capture archive
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The Linux runner loads the window icon from this bundled asset
  # (linux/runner/my_application.cc), so it must ship in flutter_assets.
  assets:
    - assets/icon/
    # The focus timer's end-of-session clips. Vendored for the same reason the
    # fonts below are: the app is offline-first, and an alarm that only rings
    # once the device has network is not an alarm.
    - assets/sounds/

  # Vendored rather than fetched at runtime: the app is offline-first, so a
  # font that only renders once the device has network would be a regression.
  # Both families are SIL OFL 1.1 (licences alongside the files).
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
