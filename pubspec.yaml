name: voice_notes_phase1
description: Offline-first Flutter voice recorder. Audio is persisted before transcription starts.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  record: ^7.1.1
  path_provider: ^2.1.6
  path: ^1.9.1
  http: ^1.6.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
